<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skill Set Lab Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1f56d8">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #c6d3e6;
      --text: #111827;
      --muted: #5b677a;
      --blue: #1f56d8;
      --blue2: #dbeafe;
      --green: #e9fbf2;
      --red: #fff1f2;
      --red2: #ffdbe1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 247, 251, .96);
      border-bottom: 1px solid var(--line);
      padding: 14px 14px 10px;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .summary { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 14px 0;
    }
    .tab {
      border: 1px solid var(--line);
      background: #e7edf7;
      color: #26354d;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
    }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    main { padding: 14px; }
    section { display: none; }
    section.active { display: block; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: #26354d;
      font-size: 13px;
      font-weight: 700;
      margin: 10px 0 6px;
    }
    select, input, button {
      width: 100%;
      min-height: 42px;
      border: 1px solid #aebdd2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    button {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      font-weight: 800;
    }
    button.secondary {
      margin-top: 8px;
      background: #e7edf7;
      color: #26354d;
      border-color: var(--line);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: #eef4fb;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      color: #26354d;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .card.owned { background: linear-gradient(90deg, var(--green), #fff 55%); }
    .card.missing { opacity: .62; }
    .combo-card.complete {
      background: var(--green);
    }
    .combo-card.incomplete .combo-score {
      background: var(--red2);
      border-color: #ffb8c2;
    }
    .combo-card .card.missing {
      background: var(--red);
      opacity: 1;
    }
    .combo-card .card.owned {
      background: var(--green);
      opacity: 1;
    }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 800;
    }
    .slot { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .skills { margin-top: 8px; display: grid; gap: 5px; }
    .skill {
      background: #f5f8fc;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 13px;
    }
    .drop-info {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .drop-info strong {
      color: #26354d;
    }
    .active-skill { background: var(--blue2); border-color: #9ec5ff; }
    .candidate-skill {
      background: #eef2f7;
      border-color: #cbd5e1;
      color: #4b5563;
      font-weight: 700;
    }
    .candidate-chip {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #4b5563;
    }
    details summary { cursor: pointer; font-weight: 800; }
    details.gear-details summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      list-style: none;
    }
    details.gear-details summary::-webkit-details-marker { display: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
    .status {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
    .missing-list h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }
    .missing-row {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .missing-row:first-of-type { border-top: 0; }
    .missing-row strong {
      display: block;
      margin-bottom: 5px;
      color: #26354d;
    }
    .missing-numbers {
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #26354d;
      font-size: 13px;
      font-weight: 700;
    }
    .check-row input {
      width: 22px;
      min-height: 22px;
      accent-color: var(--blue);
    }
    .mini-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .mini-actions button {
      min-height: 38px;
      background: #e7edf7;
      color: #26354d;
      border-color: var(--line);
    }
  </style>
</head>
<body>
  <header>
    <h1>Skill Set Lab</h1>
    <div class="summary" id="summary"></div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="search">장비 검색</button>
    <button class="tab" data-tab="combo">조합 계산</button>
    <button class="tab" data-tab="ownedTab">보유 장비</button>
  </nav>
  <main>
    <section id="search" class="active">
      <div class="panel">
        <label>스킬 조건</label>
        <select id="searchSkill1"></select>
        <select id="searchSkill2"></select>
        <select id="searchSkill3"></select>
        <label>부위</label>
        <select id="searchSlot">
          <option value="">전체</option>
          <option value="무기">무기</option>
          <option value="방패">방패</option>
          <option value="갑옷">갑옷</option>
          <option value="악세사리">악세사리</option>
          <option value="펫">펫</option>
        </select>
        <label>장비명 검색</label>
        <input id="searchText" placeholder="예: STAFF, RING">
        <label class="check-row"><input id="searchOwnedOnly" type="checkbox"> 보유 장비만 보기</label>
        <div style="height:10px"></div>
        <button id="searchBtn">검색</button>
        <button id="missingBtn" class="secondary">빈 장비 번호 보기</button>
      </div>
      <div id="searchResults"></div>
    </section>
    <section id="combo">
      <div class="panel">
        <label>반드시 발동할 스킬</label>
        <select id="comboSkill1"></select>
        <select id="comboSkill2"></select>
        <select id="comboSkill3"></select>
        <select id="comboSkill4"></select>
        <label>반드시 포함할 장비</label>
        <select id="comboEquip1"></select>
        <select id="comboEquip2"></select>
        <select id="comboEquip3"></select>
        <select id="comboEquip4"></select>
        <label>결과에서 제외할 장비</label>
        <select id="comboExclude1"></select>
        <select id="comboExclude2"></select>
        <select id="comboExclude3"></select>
        <select id="comboExclude4"></select>
        <label>조합 조건 즐겨찾기</label>
        <select id="comboFavoriteSelect"></select>
        <div class="mini-actions">
          <button id="loadComboFavorite" type="button">불러오기</button>
          <button id="saveComboFavorite" type="button">조건 저장</button>
          <button id="deleteComboFavorite" type="button">삭제</button>
          <button id="resetComboConditions" type="button">조건 초기화</button>
        </div>
        <div class="row">
          <div>
            <label>최소 발동 수</label>
            <input id="minActive" type="number" min="1" max="12" value="3">
          </div>
          <div>
            <label>최대 결과</label>
            <input id="limit" type="number" min="10" max="500" value="100">
          </div>
        </div>
        <label class="check-row"><input id="comboOwnedOnly" type="checkbox" checked> 보유 장비만</label>
        <div style="height:10px"></div>
        <button id="comboBtn">조합 찾기</button>
        <div id="comboStatus" class="status">조건을 선택한 뒤 조합 찾기를 눌러 계산하세요.</div>
      </div>
      <div id="comboResults"></div>
    </section>
    <section id="ownedTab">
      <div class="panel">
        <label>보유 장비 검색</label>
        <input id="ownedText" placeholder="장비명 또는 스킬명">
        <label>부위</label>
        <select id="ownedSlot">
          <option value="">전체</option>
          <option value="무기">무기</option>
          <option value="방패">방패</option>
          <option value="갑옷">갑옷</option>
          <option value="악세사리">악세사리</option>
          <option value="펫">펫</option>
        </select>
        <label class="check-row"><input id="hideOwned" type="checkbox"> 보유 장비 숨기기</label>
        <div class="mini-actions">
          <button id="markVisibleOwned">전체 체크</button>
          <button id="clearVisibleOwned">전체 체크 해제</button>
          <button id="copyOwnedBackup">보유 백업 복사</button>
          <button id="restoreOwnedBackup">보유 백업 복원</button>
        </div>
      </div>
      <div id="ownedResults"></div>
    </section>
  </main>

      if (!name || !name.trim()) return;

      rows.push({...condition, name: name.trim()});
      saveComboFavorites(rows);
      document.getElementById("comboFavoriteSelect").value = String(rows.length - 1);
    }
    function loadSelectedComboFavorite() {
      const index = Number(document.getElementById("comboFavoriteSelect").value);
      const rows = comboFavorites();
      if (!Number.isInteger(index) || !rows[index]) {
        alert("불러올 조건을 선택하세요.");
        return;
      }
      applyComboCondition(rows[index]);
    }
    function deleteSelectedComboFavorite() {
      const index = Number(document.getElementById("comboFavoriteSelect").value);
      const rows = comboFavorites();
      if (!Number.isInteger(index) || !rows[index]) {
        alert("삭제할 조건을 선택하세요.");
        return;
      }
      if (!confirm(`'${rows[index].name || "조건"}' 즐겨찾기를 삭제할까요?`)) return;
      rows.splice(index, 1);
      saveComboFavorites(rows);
    }
    function resetComboConditions() {
      applyComboCondition({skillIds: [], equipmentIds: [], excludedEquipmentIds: [], ownedOnly: true, minActive: 3, limit: 100});
    }
    function runSearch() {
      const required = new Set(selected(["searchSkill1","searchSkill2","searchSkill3"]));
      const slot = document.getElementById("searchSlot").value;
      const text = document.getElementById("searchText").value.trim().toLowerCase();
      const ownedOnly = document.getElementById("searchOwnedOnly").checked;
      const rows = equipment.filter(e => {
        if (slot && e.slotName !== slot) return false;
        if (ownedOnly && !owned.has(e.id)) return false;
        if (text && !e.name.toLowerCase().includes(text)) return false;
        for (const id of required) if (!e.skillIds.includes(id)) return false;
        return true;
      });
      document.getElementById("searchResults").innerHTML = rows.length ? rows.map(e => equipmentCard(e)).join("") : `<div class="empty">검색 결과가 없습니다.</div>`;
      bindOwnedToggles();
    }
    function showMissingEquipment() {
      const groups = Object.fromEntries(SLOTS.map(slot => [slot, []]));
      for (const row of DATA.equipment) {
        const slotName = SLOT_MAP[row.slot] || row.slot;
        if (!groups[slotName]) continue;
        if (!isCompleteEquipment(row)) groups[slotName].push(equipmentNumber(row.id));
      }
      document.getElementById("searchResults").innerHTML = `<div class="card missing-list">
        <h2>빈 장비 번호</h2>
        ${SLOTS.map(slot => `<div class="missing-row"><strong>${escapeHtml(slot)}</strong><div class="missing-numbers">${groups[slot].length ? groups[slot].join(", ") : "없음"}</div></div>`).join("")}
      </div>`;
    }
    function runCombo() {
      const started = performance.now();
      const button = document.getElementById("comboBtn");
      const status = document.getElementById("comboStatus");
      button.disabled = true;
      status.textContent = "조합을 계산하는 중입니다...";
      const targetIds = selected(["comboSkill1","comboSkill2","comboSkill3","comboSkill4"]);
      if (hasDuplicate(targetIds)) {
        button.disabled = false;
        status.textContent = "동일한 스킬이 골라졌습니다.";
        alert("동일한 스킬이 골라졌습니다.");
        return;
      }
      const targetMask = maskOf(targetIds);
      const minActive = Number(document.getElementById("minActive").value || 3);
      const limit = Number(document.getElementById("limit").value || 100);
      const ownedOnly = document.getElementById("comboOwnedOnly").checked;
      const groups = SLOTS.map(slot => equipment.filter(e => e.slotName === slot && (!ownedOnly || owned.has(e.id))));
      const requiredEquipmentIds = selected(["comboEquip1","comboEquip2","comboEquip3","comboEquip4"]);
      if (hasDuplicate(requiredEquipmentIds)) {
        button.disabled = false;
        status.textContent = "동일한 장비가 골라졌습니다.";
        alert("동일한 장비가 골라졌습니다.");
        return;
      }
      const excludedEquipmentIds = selected(["comboExclude1","comboExclude2","comboExclude3","comboExclude4"]);
      if (hasDuplicate(excludedEquipmentIds)) {
        button.disabled = false;
        status.textContent = "동일한 제외 장비가 골라졌습니다.";
        alert("동일한 제외 장비가 골라졌습니다.");
        return;
      }
      const overlap = requiredEquipmentIds.filter(id => excludedEquipmentIds.includes(id));
      if (overlap.length) {
        button.disabled = false;
        status.textContent = "포함 장비와 제외 장비가 겹칩니다.";
        alert(`포함 장비와 제외 장비가 겹칩니다: ${overlap.map(id => equipmentById[id]?.name || id).join(", ")}`);
        return;
      }
      const excludedSet = new Set(excludedEquipmentIds);
      for (let i = 0; i < groups.length; i++) groups[i] = groups[i].filter(e => !excludedSet.has(e.id));
      const requiredEquipment = requiredEquipmentIds
        .map(id => equipmentById[id])
        .filter(Boolean);
      const fixedSlots = new Set();
      for (const item of requiredEquipment) {
        const index = slotIndex[item.slotName];
        if (fixedSlots.has(item.slotName)) {
          button.disabled = false;
          status.textContent = "같은 부위의 장비가 골라졌습니다.";
          alert(`같은 부위의 장비가 골라졌습니다: ${item.slotName}`);
          return;
        }
        if (index === undefined) {
          groups.fill([]);
          break;
        }
        fixedSlots.add(item.slotName);
        groups[index] = [item];
      }
      if (groups.some(group => group.length === 0)) {
        document.getElementById("comboResults").innerHTML = `<div class="empty">조건에 맞는 조합이 없습니다.</div>`;
        status.textContent = "조건에 맞는 조합이 없습니다.";
        button.disabled = false;
        saveComboState([]);
        return;
      }
      const results = findCombinations(groups, targetMask, minActive, limit);
      document.getElementById("comboResults").innerHTML = results.length ? results.map(comboCard).join("") : `<div class="empty">조건에 맞는 조합이 없습니다.</div>`;
      bindExcludeButtons();
      status.textContent = results.length
        ? `조합 ${results.length.toLocaleString()}개를 찾았습니다. 계산 ${((performance.now() - started) / 1000).toFixed(2)}초`
        : "조건에 맞는 조합이 없습니다.";
      button.disabled = false;
      saveComboState(results);
    }
    function findCombinations(groups, targetMask, minActive, limit) {
      const indexedGroups = groups.map(group => group.map(e => ({e, mask: masks.get(e.id)})));
      indexedGroups.forEach(group => group.sort((a, b) => {
        const targetDiff = bitCount(b.mask & targetMask) - bitCount(a.mask & targetMask);
        if (targetDiff) return targetDiff;
        const ownedDiff = Number(owned.has(b.e.id)) - Number(owned.has(a.e.id));
        if (ownedDiff) return ownedDiff;
        return a.e.name.localeCompare(b.e.name);
      }));
      const order = SLOTS.map((_slot, i) => i).sort((a, b) => indexedGroups[a].length - indexedGroups[b].length);
      const unions = indexedGroups.map(group => group.reduce((acc, row) => acc | row.mask, 0n));
      const suffix = Array(SLOTS.length + 1).fill(null);
      let rem1 = 0n, rem2 = 0n, rem3 = 0n;
      suffix[SLOTS.length] = [rem1, rem2, rem3];
      for (let depth = SLOTS.length - 1; depth >= 0; depth--) {
        const union = unions[order[depth]];
        rem3 = rem3 | (rem2 & union);
        rem2 = rem2 | (rem1 & union);
        rem1 = rem1 | union;
        suffix[depth] = [rem1, rem2, rem3];
      }
      const ownedSuffix = Array(SLOTS.length + 1).fill(0);
      for (let depth = SLOTS.length - 1; depth >= 0; depth--) {
        const slot = order[depth];
        ownedSuffix[depth] = ownedSuffix[depth + 1] + (indexedGroups[slot].some(row => owned.has(row.e.id)) ? 1 : 0);
      }
      const selectedRows = Array(SLOTS.length).fill(null);
      const top = [];
      const keyBetter = (left, right) => left.score > right.score || (left.score === right.score && left.ownedCount > right.ownedCount);
      const keyNotBetter = (left, right) => left.score < right.score || (left.score === right.score && left.ownedCount <= right.ownedCount);
      function worstIndex() {
        let index = 0;
        for (let i = 1; i < top.length; i++) if (keyBetter(top[index], top[i])) index = i;
        return index;
      }
      function pushTop(row) {
        if (top.length < limit) {
          top.push(row);
          return;
        }
        const index = worstIndex();
        if (keyBetter(row, top[index])) top[index] = row;
      }
      function canStillMatch(depth, ge1, ge2, ge3, ownedCount) {
        const [r1, r2, r3] = suffix[depth];
        const potentialGe3 = ge3 | (ge2 & r1) | (ge1 & r2) | r3;
        const potentialGe2 = ge2 | (ge1 & r1) | r2;
        const potentialCandidate = potentialGe2 & ~potentialGe3;
        const potentialCount = bitCount(potentialGe3) + (potentialCandidate !== 0n ? 1 : 0);
        if (potentialCount < minActive) return false;
        if (targetMask !== 0n && (potentialGe2 & targetMask) !== targetMask) return false;
        if (targetMask !== 0n && bitCount(potentialCandidate & targetMask) > 1) return false;
        if (top.length >= limit) {
          const potentialScore = scoreMasks(potentialGe3, potentialCandidate, targetMask);
          const worst = top[worstIndex()];
          if (keyNotBetter({score: potentialScore, ownedCount: ownedCount + ownedSuffix[depth]}, worst)) return false;
        }
        return true;
      }
      function visit(depth, ge1, ge2, ge3, ownedCount) {
        if (!canStillMatch(depth, ge1, ge2, ge3, ownedCount)) return;
        if (depth === SLOTS.length) {
          const activeMaskValue = ge3;
          const candidateMaskValue = ge2 & ~ge3;
          const count = bitCount(activeMaskValue);
          const effectiveCount = count + (candidateMaskValue !== 0n ? 1 : 0);
          if (effectiveCount < minActive) return;
          if (targetMask !== 0n && (ge2 & targetMask) !== targetMask) return;
          if (targetMask !== 0n && bitCount(candidateMaskValue & targetMask) > 1) return;
          const combo = selectedRows.map(row => row.e);
          pushTop({
            combo,
            active: activeIds(activeMaskValue),
            candidates: activeIds(candidateMaskValue),
            score: scoreMasks(activeMaskValue, candidateMaskValue, targetMask),
            ownedCount,
          });
          return;
        }
        const slot = order[depth];
        for (const row of indexedGroups[slot]) {
          selectedRows[slot] = row;
          visit(depth + 1, ge1 | row.mask, ge2 | (ge1 & row.mask), ge3 | (ge2 & row.mask), ownedCount + (owned.has(row.e.id) ? 1 : 0));
          selectedRows[slot] = null;
        }
      }
      visit(0, 0n, 0n, 0n, 0);
      return top.sort((a, b) => b.score - a.score || b.ownedCount - a.ownedCount);
    }
    function comboCard(r) {
      const activeSet = new Set(r.active);
      const candidateSet = new Set(r.candidates || []);
      const fullyOwned = r.combo.every(e => owned.has(e.id));
      const activeText = r.active.map(skillName).join(", ");
      const candidateText = (r.candidates || []).map(skillName).join(", ");
      return `<details class="card combo-card ${fullyOwned ? "complete" : "incomplete"}">
        <summary><span class="chip combo-score">점수 ${r.score}</span> · ${escapeHtml(activeText || "기본 발동 없음")}${candidateText ? ` <span class="chip candidate-chip">+1 후보 ${escapeHtml(candidateText)}</span>` : ""}</summary>
        <div class="chips">${r.combo.map(e => `<span class="chip">${escapeHtml(e.slotName)}: ${escapeHtml(e.name)}</span>`).join("")}</div>
        ${candidateText ? `<p class="muted">+1 후보가 여러 개여도 실제 발동은 이 중 1개만 선택할 수 있습니다.</p>` : ""}
        ${r.combo.map(e => equipmentCard(e, activeSet, false, true, true, candidateSet)).join("")}
      </details>`;
    }
    function addExcludedEquipment(id, rerun = true) {
      const required = selected(["comboEquip1","comboEquip2","comboEquip3","comboEquip4"]);
      if (required.includes(id)) {
        alert("반드시 포함할 장비로 선택된 장비는 제외할 수 없습니다.");
        return;
      }
      const ids = ["comboExclude1","comboExclude2","comboExclude3","comboExclude4"];
      const current = selected(ids);
      if (current.includes(id)) return;
      const empty = ids.map(inputId => document.getElementById(inputId)).find(select => !select.value);
      if (!empty) {
        alert("결과에서 제외할 장비는 최대 4개까지 선택할 수 있습니다.");
        return;
      }
      empty.value = id;
      saveComboState();
      if (rerun) runCombo();
    }
    function bindExcludeButtons() {
      document.querySelectorAll(".exclude-gear").forEach(button => {
        button.onclick = () => addExcludedEquipment(button.dataset.id, true);
      });
    }
    function serializeComboResults() {
      return [...document.querySelectorAll(".combo-card")].map(card => {
        const ids = card.dataset.ids ? card.dataset.ids.split(",") : [];
        return ids;
      });
    }
    function saveComboState(results = null) {
      let previous = null;
      try { previous = JSON.parse(localStorage.getItem(COMBO_STATE_KEY) || "null"); } catch {}
      const rows = Array.isArray(results) ? results.map(r => ({
        equipmentIds: r.combo.map(e => e.id),
        activeIds: r.active,
        candidateIds: r.candidates || [],
        score: r.score,
      })) : (Array.isArray(previous?.results) ? previous.results : []);
      const condition = currentComboCondition();
      const state = {
        activeTab: document.querySelector(".tab.active")?.dataset.tab || "search",
        ...condition,
        results: rows,
      };
      try { localStorage.setItem(COMBO_STATE_KEY, JSON.stringify(state)); } catch {}
    }
    function restoreComboState() {
      let state = null;
      try { state = JSON.parse(localStorage.getItem(COMBO_STATE_KEY) || "null"); } catch {}
      if (!state || typeof state !== "object") return;
      applyComboCondition(state, false);
      if (Array.isArray(state.results) && state.results.length) {
        const rows = state.results.map(row => {
          const combo = Array.isArray(row.equipmentIds) ? row.equipmentIds.map(id => equipmentById[id]).filter(Boolean) : [];
          if (combo.length !== SLOTS.length) return null;
          const active = Array.isArray(row.activeIds) ? row.activeIds.filter(id => skills[id]) : [];
          const candidates = Array.isArray(row.candidateIds) ? row.candidateIds.filter(id => skills[id]) : [];
          return {combo, active, candidates, score: Number(row.score || 0), ownedCount: combo.filter(e => owned.has(e.id)).length};
        }).filter(Boolean);
        document.getElementById("comboResults").innerHTML = rows.length ? rows.map(comboCard).join("") : "";
        bindExcludeButtons();
        if (rows.length) document.getElementById("comboStatus").textContent = `이전 계산 결과 ${rows.length.toLocaleString()}개를 복원했습니다. 다시 계산하면 최신 데이터로 갱신됩니다.`;
      }
      if (state.activeTab) {
        const button = document.querySelector(`.tab[data-tab="${state.activeTab}"]`);
        if (button) button.click();
      }
    }
    function ownedRows() {
      const slot = document.getElementById("ownedSlot").value;
      const text = document.getElementById("ownedText").value.trim().toLowerCase();
      const hideOwned = document.getElementById("hideOwned").checked;
      return equipment.filter(e => {
        if (slot && e.slotName !== slot) return false;
        if (hideOwned && owned.has(e.id)) return false;
        if (!text) return true;
        const haystack = `${e.name} ${e.slotName} ${e.skillIds.map(skillName).join(" ")}`.toLowerCase();
        return haystack.includes(text);
      });
    }
    function renderOwned() {
      const rows = ownedRows();
      document.getElementById("ownedResults").innerHTML = rows.length ? rows.map(e => equipmentCard(e)).join("") : `<div class="empty">장비가 없습니다.</div>`;
      bindOwnedToggles();
    }
    function bindOwnedToggles() {
      document.querySelectorAll(".owned-toggle").forEach(input => {
        input.onchange = () => {
          if (input.checked) owned.add(input.dataset.id);
          else owned.delete(input.dataset.id);
          saveOwned();
          input.closest(".card")?.classList.toggle("owned", input.checked);
          input.closest(".card")?.classList.toggle("missing", !input.checked);
        };
      });
    }
    function setVisibleOwned(value) {
      const rows = ownedRows();
      if (!rows.length) {
        alert("현재 보이는 장비가 없습니다.");
        return;
      }
      const action = value ? "체크" : "체크 해제";
      const ok = confirm(`현재 필터로 보이는 장비 ${rows.length}개를 모두 ${action}합니다.\n기존 보유 장비 설정이 한꺼번에 바뀔 수 있습니다.\n계속할까요?`);
      if (!ok) return;
      for (const e of rows) value ? owned.add(e.id) : owned.delete(e.id);
      saveOwned();
      renderOwned();
    }
    function ownedBackupText() {
      return JSON.stringify({
        app: "SkillSetLab",
        version: 1,
        createdAt: new Date().toISOString(),
        owned: [...owned].sort()
      });
    }
    async function copyOwnedBackup() {
      const text = ownedBackupText();
      try {
        await navigator.clipboard.writeText(text);
        alert("보유 장비 백업을 클립보드에 복사했습니다.");
      } catch {
        window.prompt("아래 내용을 복사해두세요.", text);
      }
    }
    function parseOwnedBackup(text) {
      const trimmed = text.trim();
      if (!trimmed) return [];
      try {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) return parsed;
        if (Array.isArray(parsed.owned)) return parsed.owned;
      } catch {}
      return trimmed.split(/[\s,;]+/);
    }
    function restoreOwnedBackup() {
      const text = window.prompt("백업한 보유 장비 데이터를 붙여넣으세요.");
      if (!text) return;
      const ids = parseOwnedBackup(text).map(String).filter(id => equipmentById[id]);
      if (!ids.length) {
        alert("복원할 수 있는 장비 ID가 없습니다.");
        return;
      }
      owned.clear();
      ids.forEach(id => owned.add(id));
      saveOwned();
      renderOwned();
      runSearch();
      alert(`보유 장비 ${owned.size}개를 복원했습니다.`);
    }
    document.getElementById("searchBtn").addEventListener("click", runSearch);
    document.getElementById("missingBtn").addEventListener("click", showMissingEquipment);
    document.getElementById("comboBtn").addEventListener("click", runCombo);
    document.getElementById("resetComboConditions").addEventListener("click", resetComboConditions);
    document.getElementById("saveComboFavorite").addEventListener("click", saveCurrentComboFavorite);
    document.getElementById("loadComboFavorite").addEventListener("click", loadSelectedComboFavorite);
    document.getElementById("deleteComboFavorite").addEventListener("click", deleteSelectedComboFavorite);
    ["comboSkill1","comboSkill2","comboSkill3","comboSkill4","comboEquip1","comboEquip2","comboEquip3","comboEquip4","comboExclude1","comboExclude2","comboExclude3","comboExclude4","comboOwnedOnly","minActive","limit"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => saveComboState());
    });
    document.getElementById("ownedText").addEventListener("input", renderOwned);
    document.getElementById("ownedSlot").addEventListener("change", renderOwned);
    document.getElementById("hideOwned").addEventListener("change", renderOwned);
    document.getElementById("markVisibleOwned").addEventListener("click", () => setVisibleOwned(true));
    document.getElementById("clearVisibleOwned").addEventListener("click", () => setVisibleOwned(false));
    document.getElementById("copyOwnedBackup").addEventListener("click", copyOwnedBackup);
    document.getElementById("restoreOwnedBackup").addEventListener("click", restoreOwnedBackup);
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
    runSearch();
    renderOwned();
    renderComboFavorites();
    restoreComboState();
  </script>
