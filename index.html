<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skill Set Lab Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1f56d8">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #c6d3e6;
      --text: #111827;
      --muted: #5b677a;
      --blue: #1f56d8;
      --blue2: #dbeafe;
      --green: #e9fbf2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 247, 251, .96);
      border-bottom: 1px solid var(--line);
      padding: 14px 14px 10px;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .summary { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 14px 0;
    }
    .tab {
      border: 1px solid var(--line);
      background: #e7edf7;
      color: #26354d;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
    }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    main { padding: 14px; }
    section { display: none; }
    section.active { display: block; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: #26354d;
      font-size: 13px;
      font-weight: 700;
      margin: 10px 0 6px;
    }
    select, input, button {
      width: 100%;
      min-height: 42px;
      border: 1px solid #aebdd2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    button {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      font-weight: 800;
    }
    button.secondary {
      margin-top: 8px;
      background: #e7edf7;
      color: #26354d;
      border-color: var(--line);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: #eef4fb;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      color: #26354d;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .card.owned { background: linear-gradient(90deg, var(--green), #fff 55%); }
    .card.missing { opacity: .62; }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 800;
    }
    .slot { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .skills { margin-top: 8px; display: grid; gap: 5px; }
    .skill {
      background: #f5f8fc;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 13px;
    }
    .active-skill { background: var(--blue2); border-color: #9ec5ff; }
    details summary { cursor: pointer; font-weight: 800; }
    details.gear-details summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      list-style: none;
    }
    details.gear-details summary::-webkit-details-marker { display: none; }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }
    .missing-list h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }
    .missing-row {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .missing-row:first-of-type { border-top: 0; }
    .missing-row strong {
      display: block;
      margin-bottom: 5px;
      color: #26354d;
    }
    .missing-numbers {
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #26354d;
      font-size: 13px;
      font-weight: 700;
    }
    .check-row input {
      width: 22px;
      min-height: 22px;
      accent-color: var(--blue);
    }
    .mini-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .mini-actions button {
      min-height: 38px;
      background: #e7edf7;
      color: #26354d;
      border-color: var(--line);
    }
  </style>
</head>
<body>
  <header>
    <h1>Skill Set Lab</h1>
    <div class="summary" id="summary"></div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="search">장비 검색</button>
    <button class="tab" data-tab="combo">조합 계산</button>
    <button class="tab" data-tab="ownedTab">보유 장비</button>
  </nav>
  <main>
    <section id="search" class="active">
      <div class="panel">
        <label>스킬 조건</label>
        <select id="searchSkill1"></select>
        <select id="searchSkill2"></select>
        <select id="searchSkill3"></select>
        <label>부위</label>
        <select id="searchSlot">
          <option value="">전체</option>
          <option value="무기">무기</option>
          <option value="방패">방패</option>
          <option value="갑옷">갑옷</option>
          <option value="악세사리">악세사리</option>
          <option value="펫">펫</option>
        </select>
        <label>장비명 검색</label>
        <input id="searchText" placeholder="예: STAFF, RING">
        <label class="check-row"><input id="searchOwnedOnly" type="checkbox"> 보유 장비만 보기</label>
        <div style="height:10px"></div>
        <button id="searchBtn">검색</button>
        <button id="missingBtn" class="secondary">빈 장비 번호 보기</button>
      </div>
      <div id="searchResults"></div>
    </section>
    <section id="combo">
      <div class="panel">
        <label>반드시 발동할 스킬</label>
        <select id="comboSkill1"></select>
        <select id="comboSkill2"></select>
        <select id="comboSkill3"></select>
        <select id="comboSkill4"></select>
        <label>반드시 포함할 장비</label>
        <select id="comboEquip1"></select>
        <select id="comboEquip2"></select>
        <select id="comboEquip3"></select>
        <select id="comboEquip4"></select>
        <div class="row">
          <div>
            <label>최소 발동 수</label>
            <input id="minActive" type="number" min="1" max="12" value="3">
          </div>
          <div>
            <label>최대 결과</label>
            <input id="limit" type="number" min="10" max="500" value="100">
          </div>
        </div>
        <div style="height:10px"></div>
        <button id="comboBtn">조합 찾기</button>
      </div>
      <div id="comboResults"></div>
    </section>
    <section id="ownedTab">
      <div class="panel">
        <label>보유 장비 검색</label>
        <input id="ownedText" placeholder="장비명 또는 스킬명">
        <label>부위</label>
        <select id="ownedSlot">
          <option value="">전체</option>
          <option value="무기">무기</option>
          <option value="방패">방패</option>
          <option value="갑옷">갑옷</option>
          <option value="악세사리">악세사리</option>
          <option value="펫">펫</option>
        </select>
        <label class="check-row"><input id="hideOwned" type="checkbox"> 보유 장비 숨기기</label>
        <div class="mini-actions">
          <button id="markVisibleOwned">전체 체크</button>
          <button id="clearVisibleOwned">전체 체크 해제</button>
          <button id="copyOwnedBackup">보유 백업 복사</button>
          <button id="restoreOwnedBackup">보유 백업 복원</button>
        </div>
      </div>
      <div id="ownedResults"></div>
    </section>
  </main>

id": "E0557", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0558", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0559", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0560", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0561", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0562", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0563", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0564", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0565", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0566", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0567", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}, {"id": "E0568", "name": "", "slot": "5", "skill1_id": "", "skill2_id": "", "skill3_id": "", "source": "", "notes": ""}], "owned": []};
    const SLOTS = ["무기", "방패", "갑옷", "악세사리", "펫"];
    const SLOT_MAP = {"1":"무기","2":"방패","3":"갑옷","4":"악세사리","5":"펫"};
    const skills = Object.fromEntries(DATA.skills.map(s => [s.id, s]));
    const OWNED_KEY = "skill-set-lab-owned-v1";
    const defaultOwned = DATA.owned.filter(o => ["1","true","TRUE","보유"].includes(o.owned)).map(o => o.equipment_id);
    const savedOwned = (() => {
      try { return JSON.parse(localStorage.getItem(OWNED_KEY) || "null"); } catch { return null; }
    })();
    const owned = new Set(Array.isArray(savedOwned) ? savedOwned : defaultOwned);
    const equipment = DATA.equipment
      .filter(e => e.name && e.skill1_id && e.skill2_id && e.skill3_id)
      .map(e => ({...e, slotName: SLOT_MAP[e.slot] || e.slot, skillIds: [e.skill1_id, e.skill2_id, e.skill3_id]}));
    const equipmentById = Object.fromEntries(equipment.map(e => [e.id, e]));
    const slotIndex = Object.fromEntries(SLOTS.map((slot, i) => [slot, i]));
    const skillIds = DATA.skills.map(s => s.id);
    const bitIndex = Object.fromEntries(skillIds.map((id, i) => [id, BigInt(i)]));
    const masks = new Map(equipment.map(e => [e.id, maskOf(e.skillIds)]));

    function maskOf(ids) {
      let mask = 0n;
      for (const id of ids) if (bitIndex[id] !== undefined) mask |= 1n << bitIndex[id];
      return mask;
    }
    function bitCount(x) {
      let count = 0;
      while (x) { x &= x - 1n; count++; }
      return count;
    }
    function activeMask(ms) {
      let active = 0n;
      for (let a=0; a<ms.length; a++) for (let b=a+1; b<ms.length; b++) for (let c=b+1; c<ms.length; c++) active |= ms[a] & ms[b] & ms[c];
      return active;
    }
    function activeIds(mask) {
      return skillIds.filter((id, i) => (mask & (1n << BigInt(i))) !== 0n);
    }
    function skillName(id) { return skills[id]?.name || id; }
    function skillNote(id) { return skills[id]?.notes || ""; }
    function equipmentNumber(id) {
      const digits = String(id).match(/\d+/g)?.join("") || String(id);
      const number = Number(digits);
      return Number.isFinite(number) ? String(number) : String(id);
    }
    function isCompleteEquipment(row) {
      return Boolean(row.name && row.skill1_id && row.skill2_id && row.skill3_id);
    }
    function saveOwned() {
      try { localStorage.setItem(OWNED_KEY, JSON.stringify([...owned].sort())); } catch {}
      updateSummary();
    }
    function updateSummary() {
      document.getElementById("summary").textContent = `스킬 ${DATA.skills.length}개 · 장비 ${equipment.length}/${DATA.equipment.length}개 · 보유 ${owned.size}개`;
    }
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function populateSelect(id) {
      const select = document.getElementById(id);
      select.innerHTML = `<option value="">스킬 선택 안 함</option>` + DATA.skills.map(s => `<option value="${s.id}">${escapeHtml(s.name)} (${s.kind})</option>`).join("");
    }
    function populateEquipmentSelect(id) {
      const select = document.getElementById(id);
      const rows = [...equipment].sort((a, b) => {
        const slotDiff = slotIndex[a.slotName] - slotIndex[b.slotName];
        return slotDiff || a.name.localeCompare(b.name) || a.id.localeCompare(b.id);
      });
      select.innerHTML = `<option value="">장비 선택 안 함</option>` + rows.map(e => `<option value="${e.id}">[${escapeHtml(e.slotName)}] ${escapeHtml(e.name)} (${e.id})</option>`).join("");
    }
    ["searchSkill1","searchSkill2","searchSkill3","comboSkill1","comboSkill2","comboSkill3","comboSkill4"].forEach(populateSelect);
    ["comboEquip1","comboEquip2","comboEquip3","comboEquip4"].forEach(populateEquipmentSelect);
    updateSummary();

    document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    }));

    function equipmentCard(e, activeSet = new Set(), showToggle = true, expanded = false) {
      return `<div class="card ${owned.has(e.id) ? "owned" : "missing"}">
        <details class="gear-details" ${expanded ? "open" : ""}>
          <summary><span>${escapeHtml(e.name)}</span><span class="slot">${escapeHtml(e.slotName)} · ${e.id}</span></summary>
          <div class="skills">${e.skillIds.map(id => `<div class="skill ${activeSet.has(id) ? "active-skill" : ""}" title="${escapeHtml(skillNote(id))}">${escapeHtml(skillName(id))}<div class="muted">${escapeHtml(skillNote(id))}</div></div>`).join("")}</div>
        </details>
        ${showToggle ? `<label class="check-row"><input class="owned-toggle" data-id="${e.id}" type="checkbox" ${owned.has(e.id) ? "checked" : ""}> 보유 중</label>` : ""}
      </div>`;
    }
    function selected(ids) { return ids.map(id => document.getElementById(id).value).filter(Boolean); }
    function hasDuplicate(values) { return new Set(values).size !== values.length; }
    function runSearch() {
      const required = new Set(selected(["searchSkill1","searchSkill2","searchSkill3"]));
      const slot = document.getElementById("searchSlot").value;
      const text = document.getElementById("searchText").value.trim().toLowerCase();
      const ownedOnly = document.getElementById("searchOwnedOnly").checked;
      const rows = equipment.filter(e => {
        if (slot && e.slotName !== slot) return false;
        if (ownedOnly && !owned.has(e.id)) return false;
        if (text && !e.name.toLowerCase().includes(text)) return false;
        for (const id of required) if (!e.skillIds.includes(id)) return false;
        return true;
      });
      document.getElementById("searchResults").innerHTML = rows.length ? rows.map(e => equipmentCard(e)).join("") : `<div class="empty">검색 결과가 없습니다.</div>`;
      bindOwnedToggles();
    }
    function showMissingEquipment() {
      const groups = Object.fromEntries(SLOTS.map(slot => [slot, []]));
      for (const row of DATA.equipment) {
        const slotName = SLOT_MAP[row.slot] || row.slot;
        if (!groups[slotName]) continue;
        if (!isCompleteEquipment(row)) groups[slotName].push(equipmentNumber(row.id));
      }
      document.getElementById("searchResults").innerHTML = `<div class="card missing-list">
        <h2>빈 장비 번호</h2>
        ${SLOTS.map(slot => `<div class="missing-row"><strong>${escapeHtml(slot)}</strong><div class="missing-numbers">${groups[slot].length ? groups[slot].join(", ") : "없음"}</div></div>`).join("")}
      </div>`;
    }
    function runCombo() {
      const targetIds = selected(["comboSkill1","comboSkill2","comboSkill3","comboSkill4"]);
      if (hasDuplicate(targetIds)) {
        alert("동일한 스킬이 골라졌습니다.");
        return;
      }
      const targetMask = maskOf(targetIds);
      const minActive = Number(document.getElementById("minActive").value || 3);
      const limit = Number(document.getElementById("limit").value || 100);
      const groups = SLOTS.map(slot => equipment.filter(e => e.slotName === slot && owned.has(e.id)));
      const requiredEquipmentIds = selected(["comboEquip1","comboEquip2","comboEquip3","comboEquip4"]);
      if (hasDuplicate(requiredEquipmentIds)) {
        alert("동일한 장비가 골라졌습니다.");
        return;
      }
      const requiredEquipment = requiredEquipmentIds
        .map(id => equipmentById[id])
        .filter(Boolean);
      const fixedSlots = new Set();
      for (const item of requiredEquipment) {
        const index = slotIndex[item.slotName];
        if (fixedSlots.has(item.slotName)) {
          alert(`같은 부위의 장비가 골라졌습니다: ${item.slotName}`);
          return;
        }
        if (index === undefined || !owned.has(item.id)) {
          groups.fill([]);
          break;
        }
        fixedSlots.add(item.slotName);
        groups[index] = [item];
      }
      if (groups.some(group => group.length === 0)) {
        document.getElementById("comboResults").innerHTML = `<div class="empty">조건에 맞는 조합이 없습니다.</div>`;
        return;
      }
      const results = [];
      outer:
      for (const weapon of groups[0]) for (const shield of groups[1]) for (const armor of groups[2]) for (const acc of groups[3]) for (const pet of groups[4]) {
        const combo = [weapon, shield, armor, acc, pet];
        const am = activeMask(combo.map(e => masks.get(e.id)));
        const count = bitCount(am);
        if (count < minActive) continue;
        if (targetMask && (am & targetMask) !== targetMask) continue;
        const targetCount = bitCount(am & targetMask);
        results.push({combo, active: activeIds(am), score: targetCount * 2 + (count - targetCount)});
        if (results.length >= limit) break outer;
      }
      results.sort((a,b) => b.score - a.score);
      document.getElementById("comboResults").innerHTML = results.length ? results.map(comboCard).join("") : `<div class="empty">조건에 맞는 조합이 없습니다.</div>`;
    }
    function comboCard(r) {
      const activeSet = new Set(r.active);
      return `<details class="card">
        <summary>점수 ${r.score} · ${r.active.map(skillName).join(", ")}</summary>
        <div class="chips">${r.combo.map(e => `<span class="chip">${escapeHtml(e.slotName)}: ${escapeHtml(e.name)}</span>`).join("")}</div>
        ${r.combo.map(e => equipmentCard(e, activeSet, false, true)).join("")}
      </details>`;
    }
    function ownedRows() {
      const slot = document.getElementById("ownedSlot").value;
      const text = document.getElementById("ownedText").value.trim().toLowerCase();
      const hideOwned = document.getElementById("hideOwned").checked;
      return equipment.filter(e => {
        if (slot && e.slotName !== slot) return false;
        if (hideOwned && owned.has(e.id)) return false;
        if (!text) return true;
        const haystack = `${e.name} ${e.slotName} ${e.skillIds.map(skillName).join(" ")}`.toLowerCase();
        return haystack.includes(text);
      });
    }
    function renderOwned() {
      const rows = ownedRows();
      document.getElementById("ownedResults").innerHTML = rows.length ? rows.map(e => equipmentCard(e)).join("") : `<div class="empty">장비가 없습니다.</div>`;
      bindOwnedToggles();
    }
    function bindOwnedToggles() {
      document.querySelectorAll(".owned-toggle").forEach(input => {
        input.onchange = () => {
          if (input.checked) owned.add(input.dataset.id);
          else owned.delete(input.dataset.id);
          saveOwned();
          input.closest(".card")?.classList.toggle("owned", input.checked);
          input.closest(".card")?.classList.toggle("missing", !input.checked);
        };
      });
    }
    function setVisibleOwned(value) {
      const rows = ownedRows();
      if (!rows.length) {
        alert("현재 보이는 장비가 없습니다.");
        return;
      }
      const action = value ? "체크" : "체크 해제";
      const ok = confirm(`현재 필터로 보이는 장비 ${rows.length}개를 모두 ${action}합니다.\n기존 보유 장비 설정이 한꺼번에 바뀔 수 있습니다.\n계속할까요?`);
      if (!ok) return;
      for (const e of rows) value ? owned.add(e.id) : owned.delete(e.id);
      saveOwned();
      renderOwned();
    }
    function ownedBackupText() {
      return JSON.stringify({
        app: "SkillSetLab",
        version: 1,
        createdAt: new Date().toISOString(),
        owned: [...owned].sort()
      });
    }
    async function copyOwnedBackup() {
      const text = ownedBackupText();
      try {
        await navigator.clipboard.writeText(text);
        alert("보유 장비 백업을 클립보드에 복사했습니다.");
      } catch {
        window.prompt("아래 내용을 복사해두세요.", text);
      }
    }
    function parseOwnedBackup(text) {
      const trimmed = text.trim();
      if (!trimmed) return [];
      try {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) return parsed;
        if (Array.isArray(parsed.owned)) return parsed.owned;
      } catch {}
      return trimmed.split(/[\s,;]+/);
    }
    function restoreOwnedBackup() {
      const text = window.prompt("백업한 보유 장비 데이터를 붙여넣으세요.");
      if (!text) return;
      const ids = parseOwnedBackup(text).map(String).filter(id => equipmentById[id]);
      if (!ids.length) {
        alert("복원할 수 있는 장비 ID가 없습니다.");
        return;
      }
      owned.clear();
      ids.forEach(id => owned.add(id));
      saveOwned();
      renderOwned();
      runSearch();
      alert(`보유 장비 ${owned.size}개를 복원했습니다.`);
    }
    document.getElementById("searchBtn").addEventListener("click", runSearch);
    document.getElementById("missingBtn").addEventListener("click", showMissingEquipment);
    document.getElementById("comboBtn").addEventListener("click", runCombo);
    document.getElementById("ownedText").addEventListener("input", renderOwned);
    document.getElementById("ownedSlot").addEventListener("change", renderOwned);
    document.getElementById("hideOwned").addEventListener("change", renderOwned);
    document.getElementById("markVisibleOwned").addEventListener("click", () => setVisibleOwned(true));
    document.getElementById("clearVisibleOwned").addEventListener("click", () => setVisibleOwned(false));
    document.getElementById("copyOwnedBackup").addEventListener("click", copyOwnedBackup);
    document.getElementById("restoreOwnedBackup").addEventListener("click", restoreOwnedBackup);
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
    runSearch();
    renderOwned();
  </script>
